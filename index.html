<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Addition Math Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Voice Math Challenge</h1>
    <p class="instructions" id="instructions">Keep a running total in your head and say the answer aloud!</p>

    <!-- Game Mode Selector -->
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="add">Addition (+)</button>
      <button class="mode-btn" data-mode="subtract">Subtraction (-)</button>
      <button class="mode-btn" data-mode="mixed">Mixed (+/-)</button>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
    </div>

    <div class="display-box">
      <div class="number-label">New Number</div>
      <div class="current-number" id="number-display">?</div>
    </div>

    <div class="feedback" id="feedback">Click Start to Play</div>
    <div class="transcript-box" id="transcript">Heard: "..."</div>

    <button class="mic-btn" id="start-btn">Start Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
